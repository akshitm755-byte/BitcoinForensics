name: CI — Contracts, Leakage & PyTorch Verification

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch & Test Dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.3.1+cpu
          pip install pydantic networkx numpy pandas matplotlib reportlab fastapi httpx pytest
          pip install -e ./contracts
      - name: Run Contract, Temporal Leakage & PyTorch Pipeline Tests
        run: pytest tests/test_pipeline_and_model.py -v
