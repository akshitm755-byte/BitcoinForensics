name: CI — ABI v4 Verification Gate

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch & Test Dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.3.1+cpu
          pip install pydantic networkx numpy pandas matplotlib reportlab fastapi httpx pytest
          pip install -e ./contracts
      - name: Run Full v4 Verification Suite
        run: pytest tests/test_v4_full_pipeline.py -v
